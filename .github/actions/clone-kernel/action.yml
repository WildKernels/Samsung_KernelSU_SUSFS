name: 'Download Samsung Kernels'
description: "initialize and download the samsung kernel"

runs:
 using: composite
 steps:
   - name: Clone ONEUI Kernel Source
     if: ${{ !endsWith(env.BRANCH, 'LOS') }}
     shell: bash
     run: |
      git clone --depth 1 -b $BRANCH --single-branch https://github.com/WildKernels/Samsung_Kernels.git $CONFIG

   - name: Clone LINEAGEOS Kernel Source
     if: ${{ endsWith(env.BRANCH, 'LOS') }}
     shell: bash
     run: |
      git clone --depth 1 -b lineage-24.0 --single-branch https://github.com/LineageOS/android_kernel_samsung_s5e9925.git $CONFIG

      #setup LOS toolchain
      cd "$CONFIG"
      mkdir -p toolchain/clang/host/linux-x86
      cd toolchain/clang/host/linux-x86
      wget https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.3/clang+llvm-18.1.3-x86_64-linux-gnu-ubuntu-18.04.tar.xz
      tar -xf clang+llvm-18.1.3-x86_64-linux-gnu-ubuntu-18.04.tar.xz
      ./clang+llvm-18.1.3-x86_64-linux-gnu-ubuntu-18.04/bin/clang --version
